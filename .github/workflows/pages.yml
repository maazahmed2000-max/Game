# Publish the pygbag build to GitHub Pages when you push to main.
#
# Repo settings → Pages → Build and deployment → Source: GitHub Actions
# After first run, open the workflow summary for the Pages URL
# (typically https://<user>.github.io/<repo>/).

name: Publish web game

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build wasm bundle
        run: python -m pygbag --build --ume_block 0 .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
